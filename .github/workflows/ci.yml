name: Prüfungen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typprüfung, Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm in der Version aus package.json („packageManager“)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Typprüfung
        run: pnpm typecheck

      - name: Tests (inkl. Prüfungen für jedes Spielmodul)
        run: pnpm test

      - name: Web-App bauen
        run: pnpm build

      - name: Gebaute App für GitHub Pages bereitstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  # Veröffentlicht wird nur, was alle Prüfungen bestanden hat.
  deploy:
    name: Veröffentlichen auf spiele.lipponer.de
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
