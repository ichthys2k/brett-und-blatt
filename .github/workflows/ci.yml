name: Prüfungen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typprüfung, Tests und Build
    runs-on: ubuntu-latest
    env:
      # Klänge liegen im privaten Repo brett-und-blatt-klaenge (ElevenLabs-Lizenz).
      # Ohne das Secret KLAENGE_DEPLOY_KEY (z. B. bei PRs aus Forks) wird die App stumm gebaut.
      HAS_KLAENGE: ${{ secrets.KLAENGE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Ganze Geschichte, damit die Prüfung der Commit-Adressen den Bereich des Pushes bzw. PRs sieht.
          fetch-depth: 0

      # Jeder neue Commit muss Cornelius' Noreply-Adresse tragen (Autor und Committer).
      # PRs aus Forks sind ausgenommen: Fremde Mitwirkende committen mit ihrer eigenen Adresse.
      - name: Commit-Adressen prüfen
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: bash scripts/commit-adresse-pruefen.sh "$VON" "$BIS"
        env:
          VON: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          BIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Klänge aus dem privaten Repo holen
        if: env.HAS_KLAENGE == 'true'
        uses: actions/checkout@v7
        with:
          repository: ichthys2k/brett-und-blatt-klaenge
          ssh-key: ${{ secrets.KLAENGE_DEPLOY_KEY }}
          path: klaenge-repo
          persist-credentials: false

      # pnpm in der Version aus package.json („packageManager“)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Typprüfung
        run: pnpm typecheck

      - name: Tests (inkl. Prüfungen für jedes Spielmodul)
        run: pnpm test

      # Spieleserver lokal starten (Wrangler, kein Konto nötig), dann der Rauchtest wie zwei Browser
      # und der Text-Client als Prüfstein für fremde Clients (#336): ganze Partien gegen Server-Bots
      # nur über das offene Protokoll, mit Wiedereinstieg nach einem Verbindungsabbruch.
      - name: Spieleserver lokal mit Rauchtest und Text-Client
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm --filter @brett-und-blatt/server dev > wrangler.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          node apps/server/scripts/smoke.mjs || { tail -50 wrangler.log; exit 1; }
          node apps/cli/test/partie.mjs || { tail -50 wrangler.log; exit 1; }

      # Adresse des Spieleservers aus der GitHub-Variable GAME_SERVER.
      # Ohne Variable bleibt der Online-Bereich unsichtbar.
      - name: Web-App bauen
        run: pnpm build
        env:
          VITE_GAME_SERVER: ${{ vars.GAME_SERVER }}
          # Schalter für Hinweise aufs Gerät (Web Push, #242): Solange die Variable leer ist, bleibt die Funktion in der Oberfläche unsichtbar.
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          # Gesetzt, wenn die Klänge geholt wurden – dann bricht der Build ab, falls eine Datei fehlt.
          KLAENGE_DIR: ${{ env.HAS_KLAENGE == 'true' && format('{0}/klaenge-repo', github.workspace) || '' }}

      # Jedes Spiel einmal frisch und einmal nach allen anderen im Browser starten
      # (Abstürze, riesige Seiten, CSS-Kollisionen zwischen Spielen).
      - name: Browser für den Rauchtest installieren
        run: pnpm exec playwright install chromium

      - name: Rauchtest im Browser
        run: node scripts/rauchtest.mjs

      - name: Gebaute App für GitHub Pages bereitstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  # Spieleserver (Cloudflare-Worker) – vor der Web-App, damit die neue
  # Web-App nie auf einen alten Server trifft. Braucht das Secret
  # CLOUDFLARE_API_TOKEN (nur „Workers Scripts: Bearbeiten“); die
  # Konto-ID steht in apps/server/wrangler.jsonc. Fehlt das Secret,
  # schlägt der Schritt fehl und die Web-App bleibt auf dem alten Stand.
  deploy-server:
    name: Spieleserver auf Cloudflare veröffentlichen
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      # Web Push (#242): Öffentlicher Schlüssel und Absender kommen aus den GitHub-Variablen VAPID_PUBLIC_KEY und VAPID_SUBJECT,
      # der private Schlüssel liegt als Wrangler-Secret VAPID_PRIVATE_KEY auf dem Server. Ist die Variable leer, fehlt der Schlüssel
      # auf dem Server, und er ignoriert Abos (derselbe Schalter wie im Build der Web-App).
      - name: Worker veröffentlichen
        run: |
          args=()
          if [ -n "$VAPID_PUBLIC_KEY" ]; then
            args+=(--var "VAPID_PUBLIC_KEY:$VAPID_PUBLIC_KEY" --var "VAPID_SUBJECT:${VAPID_SUBJECT:-https://spiele.lipponer.de}")
          fi
          pnpm --filter @brett-und-blatt/server exec wrangler deploy "${args[@]}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          WRANGLER_SEND_METRICS: 'false'

  # Veröffentlicht wird nur, was alle Prüfungen bestanden hat und erst,
  # wenn der passende Spieleserver läuft.
  deploy:
    name: Veröffentlichen auf spiele.lipponer.de
    needs: [check, deploy-server]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
