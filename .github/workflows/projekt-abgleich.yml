# Gleicht Status, Priorität und Bereich zwischen den Labels der Issues und den
# Feldern des GitHub-Projekts „Brett & Blatt – Planung“ ab – in beide
# Richtungen, die jüngere Änderung gewinnt (Skript scripts/projekt-abgleich.mjs).
#
# - Label-Änderungen am Issue lösen sofort einen Lauf für dieses Issue aus.
# - Änderungen im Projekt meldet GitHub nicht an Actions; sie holt der
#   Lauf alle 5 Minuten ab (GitHub startet geplante Läufe teils verspätet).
#
# Braucht das Secret PROJECT_TOKEN (klassischer Token mit Recht „project“);
# ohne Secret läuft der Job durch und tut nichts. Labels schreibt der Job mit
# dem eingebauten GITHUB_TOKEN – solche Änderungen starten keinen neuen Lauf.
name: Projekt-Abgleich

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: projekt-abgleich
  cancel-in-progress: false

jobs:
  abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/projekt-abgleich.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Labels und Projekt abgleichen
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: node scripts/projekt-abgleich.mjs ${{ github.event.issue.number }}
