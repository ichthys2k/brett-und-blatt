name: Fehler melden
description: Etwas funktioniert nicht wie gedacht.
title: "[Fehler] "
labels: ["fehler"]
body:
  - type: input
    id: spiel
    attributes:
      label: Spiel oder Bereich
      placeholder: z. B. Skat, Online-Lobby, Startseite
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartet
    validations:
      required: true
  - type: textarea
    id: tatsaechlich
    attributes:
      label: Tatsächlich
      description: Fehlermeldung, Screenshot oder Raumcode, falls vorhanden.
    validations:
      required: true
  - type: input
    id: geraet
    attributes:
      label: Gerät und Browser
      placeholder: z. B. Android-Handy, Chrome
